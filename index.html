<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Uyển Nhi — Trợ lý nhắc việc</title>
<meta name="theme-color" content="#D21F2B">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="avatar.png">
<style>
  :root{
    --red:#D21F2B; --red-dark:#A81620; --red-soft:#FDECEC;
    --ink:#1F1B2D; --muted:#8A8A93; --bg:#F6F6F8; --card:#FFFFFF;
    --gold:#C6A15B; --gold-soft:#F7F0DE; --line:#ECECF0;
    --green:#1E7E4D; --amber:#B7791F;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;font-family:var(--sans);background:var(--bg);color:var(--ink);
    min-height:100vh;padding-bottom:70px;line-height:1.5;}
  html[lang="zh"] body{line-height:1.6;}
  /* ---------- Header ---------- */
  header{background:#fff;border-bottom:1px solid var(--line);padding:18px 16px 14px;
    position:sticky;top:0;z-index:50;}
  .head-top{display:flex;align-items:center;gap:12px;max-width:1100px;margin:0 auto;}
  .avatar{width:52px;height:52px;border-radius:50%;object-fit:cover;flex-shrink:0;
    border:2px solid var(--red);padding:1px;background:#fff;}
  .head-main{flex:1;min-width:0;}
  .pill{display:inline-block;background:var(--red);color:#fff;font-size:11px;font-weight:800;
    letter-spacing:1.5px;padding:4px 12px;border-radius:20px;margin-bottom:5px;}
  html[lang="zh"] .pill{letter-spacing:2px;}
  .head-main h1{margin:0;font-size:24px;font-weight:900;letter-spacing:.3px;line-height:1.2;}
  .head-main h1 .accent{color:var(--red);}
  .head-main p{margin:3px 0 0;font-size:13px;color:var(--muted);}
  .lang-sw{display:flex;gap:4px;flex-shrink:0;background:var(--bg);border-radius:12px;padding:3px;}
  .lang-sw button{border:none;background:transparent;padding:7px 10px;border-radius:9px;
    font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;font-family:var(--sans);}
  .lang-sw button.on{background:var(--ink);color:#fff;}
  .gear-btn{border:1px solid var(--line);background:#fff;width:42px;height:42px;border-radius:12px;
    font-size:20px;cursor:pointer;flex-shrink:0;}
  .gear-btn:active{transform:scale(.94);}
  .mic-wrap{position:relative;}
  .mic-wrap input{padding-right:52px;}
  .mic-btn{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;
    border-radius:50%;border:none;background:var(--red);color:#fff;font-size:19px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(210,31,43,.35);}
  .mic-btn:active{transform:translateY(-50%) scale(.92);}
  .mic-btn.listening{animation:micpulse 1.2s infinite;}
  @keyframes micpulse{0%,100%{box-shadow:0 0 0 0 rgba(210,31,43,.5);}50%{box-shadow:0 0 0 12px rgba(210,31,43,0);}}
  .mic-status{font-size:13px;color:var(--muted);margin-top:6px;min-height:20px;line-height:1.5;}
  .mic-status b{color:var(--red);}
  .memo-row{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .memo-btn{border:2px dashed var(--red);background:#fff;color:var(--red);border-radius:999px;
    padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;}
  .memo-btn.rec{animation:micpulse 1.2s infinite;background:var(--red);color:#fff;border-style:solid;}
  .memo-link{border:none;background:none;color:#1a73e8;font-size:14px;cursor:pointer;text-decoration:underline;padding:4px;}
  .btn-mini.tg{background:#229ED9;}
  .btn-mini.tg:active{transform:scale(.94);}
  /* ---------- Tabs ---------- */
  .tabs{display:flex;gap:8px;margin:10px 0 4px;}
  .tabs button{flex:1;border:1.5px solid var(--line);background:var(--bg);padding:10px;border-radius:12px;
    font-size:14px;font-weight:800;color:var(--muted);cursor:pointer;font-family:var(--sans);}
  .tabs button.on{background:var(--red);border-color:var(--red);color:#fff;}
  /* ---------- Bottom sheet ---------- */
  .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;
    align-items:flex-end;justify-content:center;}
  .sheet-backdrop.show{display:flex;}
  .sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;padding:10px 20px 26px;
    animation:slideUp .25s ease-out;max-height:80vh;overflow-y:auto;}
  @keyframes slideUp{from{transform:translateY(60px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:44px;height:5px;border-radius:3px;background:#DDDDE3;margin:6px auto 12px;}
  .sheet h2{margin:0 0 6px;font-size:18px;font-weight:800;}
  .sheet-sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:16px 0 4px;}
  .manage-item{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
  .manage-info{flex:1;min-width:0;}
  .manage-title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .manage-time{font-size:12px;color:var(--muted);}
  .manage-item .btn-mini{flex:0 0 auto;padding:8px 14px;}
  .manage-empty{color:var(--muted);font-size:13px;padding:8px 0;}
  .stats{display:flex;gap:10px;max-width:1100px;margin:12px auto 0;}
  .stat{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:14px;
    padding:10px 6px;text-align:center;position:relative;overflow:hidden;}
  .stat b{display:block;font-size:24px;font-weight:900;color:var(--red);line-height:1.15;}
  .stat span{font-size:11px;color:var(--muted);font-weight:600;}
  .stat.hot::after{content:'';position:absolute;top:8px;right:8px;width:8px;height:8px;
    border-radius:50%;background:var(--red);display:none;}
  .stat.hot.show::after{display:block;}
  /* ---------- Layout ---------- */
  main{max-width:1100px;margin:0 auto;padding:14px 14px;}
  .cols{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:960px){.cols{grid-template-columns:380px 1fr;align-items:start;}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.04);}
  .card h2{margin:0 0 4px;font-size:17px;font-weight:800;}
  .card h2 .dot{display:inline-block;width:8px;height:8px;border-radius:50%;
    background:var(--red);margin-right:8px;vertical-align:2px;}
  label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:700;}
  input[type=text],input[type=datetime-local],select{
    width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;font-size:16px;
    background:#fff;color:var(--ink);outline:none;font-family:var(--sans);}
  input:focus,select:focus{border-color:var(--red);}
  .row2{display:flex;gap:10px;}
  .row2>div{flex:1;min-width:0;}
  .btn{display:block;width:100%;padding:15px;margin-top:16px;border:none;border-radius:14px;cursor:pointer;
    background:var(--red);color:#fff;font-size:17px;font-weight:800;letter-spacing:.5px;
    box-shadow:0 8px 20px rgba(210,31,43,.3);}
  .btn:active{transform:scale(.98);background:var(--red-dark);}
  .btn-ghost{background:#fff;color:var(--red);border:1.5px solid var(--red);box-shadow:none;font-size:15px;}
  /* ---------- Tasks ---------- */
  .section-title{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px;
    margin:16px 2px 8px;text-transform:uppercase;}
  .task{display:flex;align-items:flex-start;gap:11px;padding:13px 12px;border-radius:12px;
    background:#fff;border:1px solid var(--line);margin-bottom:8px;position:relative;overflow:hidden;}
  .task::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);}
  .task.overdue::before{background:var(--red);}
  .task.done{opacity:.5;}
  .task.done::before{background:#D8D8DE;}
  .task.done .t-title{text-decoration:line-through;}
  .check{width:26px;height:26px;border-radius:50%;border:2px solid #C9C9D2;flex-shrink:0;
    margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:13px;background:#fff;}
  .task.done .check{background:var(--green);border-color:var(--green);}
  .t-body{flex:1;min-width:0;}
  .t-title{font-weight:700;font-size:15px;line-height:1.45;word-break:break-word;}
  .t-meta{font-size:12.5px;color:var(--muted);margin-top:4px;}
  .t-time{font-weight:800;color:var(--ink);}
  .task.overdue .t-time{color:var(--red);}
  .t-actions{flex-shrink:0;}
  .icon-btn{border:1px solid var(--line);background:#fff;color:var(--muted);
    width:34px;height:34px;border-radius:10px;font-size:15px;cursor:pointer;}
  .icon-btn.del{color:var(--red);}
  .t-btns{display:flex;gap:8px;margin-top:10px;}
  .btn-mini{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 6px;
    font-size:13px;font-weight:800;color:var(--ink);cursor:pointer;font-family:var(--sans);}
  .btn-mini:active{transform:scale(.96);}
  .btn-mini.ack{background:var(--green);border-color:var(--green);color:#fff;flex:1.5;}
  .btn-mini.del{color:var(--red);flex:.8;}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:12px;
    margin-left:6px;vertical-align:1px;background:var(--gold-soft);color:#8A6A2B;}
  .badge.late{background:var(--red);color:#fff;}
  .empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:14px;line-height:1.7;}
  .empty .big{font-size:42px;display:block;margin-bottom:8px;}
  /* ---------- Nag ---------- */
  .nag-banner{background:#fff;border:2px solid var(--red);border-radius:16px;
    padding:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(210,31,43,.16);
    animation:pulse 1.8s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 8px 24px rgba(210,31,43,.14);}50%{box-shadow:0 8px 30px rgba(210,31,43,.32);}}
  .nag-title{font-weight:900;color:var(--red);font-size:16px;margin-bottom:4px;}
  .nag-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--red-soft);border-radius:10px;padding:9px 11px;margin-top:8px;}
  .nag-item span{font-weight:700;font-size:14px;}
  .btn-ack{border:none;background:var(--green);color:#fff;font-weight:800;font-size:14px;
    padding:10px 18px;border-radius:10px;cursor:pointer;flex-shrink:0;white-space:nowrap;}
  .btn-ack:active{transform:scale(.95);}
  /* ---------- Misc ---------- */
  .perm-banner{background:#FFF8E6;border:1.5px solid var(--gold);border-radius:14px;padding:13px;
    font-size:14px;margin-bottom:14px;display:none;line-height:1.6;}
  .perm-banner.show{display:block;}
  .perm-banner button{margin-top:10px;padding:11px 22px;border:none;border-radius:12px;cursor:pointer;
    background:var(--red);color:#fff;font-weight:800;font-size:14px;}
  .setting-row{display:flex;align-items:center;gap:11px;padding:11px 0;
    border-bottom:1px solid var(--line);cursor:pointer;font-size:15px;}
  .setting-row:last-of-type{border-bottom:none;}
  .setting-row input{width:21px;height:21px;accent-color:var(--red);flex-shrink:0;}
  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 14px;line-height:1.8;}
  footer b{color:var(--red);}
</style>
</head>
<body>
<header>
  <div class="head-top">
    <img class="avatar" src="avatar.png" alt="Uyen Nhi">
    <div class="head-main">
      <span class="pill" id="ui-badge">TRỢ LÝ AI</span>
      <h1 id="ui-title">Uyển <span class="accent">Nhi</span></h1>
      <p id="greeting"></p>
    </div>
    <div class="lang-sw" id="langSw">
      <button data-lang="vi" class="on">VI</button><button data-lang="en">EN</button><button data-lang="zh">中文</button>
    </div>
    <button class="gear-btn" id="installBtn" style="display:none" onclick="installApp()">📲</button><button class="gear-btn" onclick="openSettings()" aria-label="settings">⚙️</button>
  </div>
  <div class="stats">
    <div class="stat"><b id="st-today">0</b><span id="ui-stToday">Hôm nay</span></div>
    <div class="stat" id="statPending"><b id="st-pending">0</b><span id="ui-stPending">Chưa xong</span></div>
    <div class="stat"><b id="st-done">0</b><span id="ui-stDone">Đã xong</span></div>
  </div>
</header>

<main>
  <div class="perm-banner" id="permBanner">
    <span id="ui-permText"></span><br><button onclick="askPermission()" id="ui-permBtn"></button>
  </div>
  <div class="cols">
    <div>
      <div class="card">
        <h2><span class="dot"></span><span id="ui-addTitle"></span></h2>
        <label id="ui-fWhatL"></label>
        <div class="mic-wrap">
          <input type="text" id="f-title" maxlength="120">
          <button class="mic-btn" id="micBtn" onclick="toggleMic()" title="🎤">🎤</button>
        </div>
        <div class="mic-status" id="micStatus"></div>
        <div class="memo-row">
          <button class="memo-btn" id="memoBtn" onclick="toggleMemoRec()">🎤 <span id="memoBtnT"></span></button>
          <span class="mic-status" id="memoStatus"></span>
          <button class="memo-link" id="memoPlay" style="display:none" onclick="playMemoPreview()">▶ <span id="memoPlayT"></span></button>
          <button class="memo-link" id="memoDel" style="display:none" onclick="clearMemo()">✕</button>
        </div>
        <div class="row2">
          <div><label id="ui-fWhenL"></label><input type="datetime-local" id="f-when"></div>
          <div><label id="ui-fRepeatL"></label>
            <select id="f-repeat">
              <option value="none" id="ui-rOnce"></option>
              <option value="daily" id="ui-rDaily"></option>
              <option value="weekly" id="ui-rWeekly"></option>
            </select>
          </div>
        </div>
        <label id="ui-fNoteL"></label>
        <input type="text" id="f-note" maxlength="200">
        <button class="btn" onclick="addTask()" id="ui-addBtn"></button>
      </div>
    </div>
    <div>
      <div class="card">
        <h2><span class="dot"></span><span id="ui-listTitle"></span></h2>
        <div class="tabs">
          <button data-tab="upcoming" class="on" id="tabUpcoming" onclick="setTab('upcoming')"></button>
          <button data-tab="done" id="tabDone" onclick="setTab('done')"></button>
        </div>
        <div id="taskList"></div>
      </div>
    </div>
  </div>
</main>


<!-- Bảng sửa lịch hẹn -->
<div class="sheet-backdrop" id="editBackdrop" onclick="closeEdit()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <h2>✏️ <span id="ui-editTitle"></span></h2>
    <label id="ui-eWhatL"></label>
    <input type="text" id="e-title" maxlength="120">
    <div class="row2">
      <div><label id="ui-eWhenL"></label><input type="datetime-local" id="e-when"></div>
      <div><label id="ui-eRepeatL"></label>
        <select id="e-repeat">
          <option value="none" id="ui-eROnce"></option>
          <option value="daily" id="ui-eRDaily"></option>
          <option value="weekly" id="ui-eRWeekly"></option>
        </select>
      </div>
    </div>
    <label id="ui-eNoteL"></label>
    <input type="text" id="e-note" maxlength="200">
    <button class="btn" onclick="saveEdit()" id="ui-eSaveBtn"></button>
  </div>
</div>
<!-- Bảng cài đặt trượt từ dưới lên (kiểu app TQ) -->
<div class="sheet-backdrop" id="sheetBackdrop" onclick="closeSettings()">
  <div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-handle"></div>
    <h2>⚙️ <span id="ui-setTitle"></span></h2>
    <label class="setting-row"><input type="checkbox" id="set-voice" checked><span id="ui-setVoice"></span></label>
    <label class="setting-row"><input type="checkbox" id="set-sound" checked><span id="ui-setSound"></span></label>
    <button class="btn btn-ghost" onclick="testNotify()" id="ui-testBtn"></button>
    <div class="sheet-sec">📅 <span id="ui-manageTitle"></span></div>
    <div id="manageList"></div>
    <div class="sheet-sec">📱 <span id="ui-phoneGuideT"></span></div>
    <div class="mic-status" id="ui-phoneGuide" style="margin:6px 0 12px"></div>
    <button class="btn" onclick="closeSettings()" id="ui-closeBtn"></button>
  </div>
</div>

<footer><b id="ui-footName">Uyển Nhi</b> · <span id="ui-footText"></span><br><span style="opacity:.6">v15</span></footer>

<script>

const LS_KEY='uyennhi_reminders_v1', SET_KEY='uyennhi_reminder_settings';
let tasks=loadTasks(), settings=loadSettings();
function loadTasks(){try{
  const a=JSON.parse(localStorage.getItem(LS_KEY))||[];
  return a.filter(x=>x&&typeof x==='object').map(x=>({
    id:x.id||Date.now()+Math.random(), title:String(x.title||''), when:Number(x.when)||Date.now(),
    repeat:['none','daily','weekly'].includes(x.repeat)?x.repeat:'none', note:String(x.note||''),memo:typeof x.memo==='string'?x.memo:null,
    done:!!x.done, preDayNotified:!!x.preDayNotified, preHourNotified:!!x.preHourNotified,
    ack:false, lastNag:Number(x.lastNag)||0 }));
}catch(e){return[]}}
function saveTasks(){localStorage.setItem(LS_KEY,JSON.stringify(tasks));}
function loadSettings(){try{return Object.assign({voice:true,sound:true},JSON.parse(localStorage.getItem(SET_KEY))||{})}catch(e){return{voice:true,sound:true}}}
function saveSettings(){localStorage.setItem(SET_KEY,JSON.stringify(settings));}

function askPermission(){
  if(!('Notification' in window))return alert(t('aNoNotif'));
  Notification.requestPermission().then(p=>{
    if(p==='granted')document.getElementById('permBanner').classList.remove('show');
    else alert(t('aBlocked'));
  });
}
function addTask(){
  const title=document.getElementById('f-title').value.trim();
  const when=document.getElementById('f-when').value;
  const repeat=document.getElementById('f-repeat').value;
  const note=document.getElementById('f-note').value.trim();
  if(!title)return alert(t('aNoTitle'));
  if(!when)return alert(t('aNoWhen'));
  const dt=new Date(when);
  if(dt<=new Date()&&repeat==='none')return alert(t('aPast'));
  tasks.push({id:Date.now(),title:title,when:dt.getTime(),repeat:repeat,note:note,done:false,
    preDayNotified:false,preHourNotified:false,ack:false,lastNag:0,memo:pendingMemo||null});
  saveTasks();
  document.getElementById('f-title').value='';document.getElementById('f-note').value='';
  pendingMemo=null;memoUI();
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  render(); voiceAdd();
}
function toggleDone(id){const x=tasks.find(a=>a.id===id);if(!x)return;x.done=!x.done;saveTasks();render();}
function delTask(id){if(!confirm(t('cDel')))return;tasks=tasks.filter(a=>a.id!==id);saveTasks();render();}
let editingId=null;
function openEdit(id){
  const x=tasks.find(a=>a.id===id);if(!x)return;
  editingId=id;
  document.getElementById('e-title').value=x.title;
  const d=new Date(x.when),pad=n=>String(n).padStart(2,'0');
  document.getElementById('e-when').value=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  document.getElementById('e-repeat').value=x.repeat;
  document.getElementById('e-note').value=x.note||'';
  document.getElementById('editBackdrop').classList.add('show');
}
function closeEdit(){document.getElementById('editBackdrop').classList.remove('show');editingId=null;}
function saveEdit(){
  const x=tasks.find(a=>a.id===editingId);if(!x)return closeEdit();
  const title=document.getElementById('e-title').value.trim();
  const when=document.getElementById('e-when').value;
  if(!title)return alert(t('aNoTitle'));
  if(!when)return alert(t('aNoWhen'));
  x.title=title;x.when=new Date(when).getTime();
  x.repeat=document.getElementById('e-repeat').value;
  x.note=document.getElementById('e-note').value.trim();
  x.preDayNotified=false;x.preHourNotified=false;x.lastNag=0;
  saveTasks();closeEdit();render();renderManageList();
}
function ackTask(id){
  const x=tasks.find(a=>a.id===id);if(!x)return;
  if(x.repeat==='daily')x.when+=86400000;else if(x.repeat==='weekly')x.when+=7*86400000;else x.done=true;
  x.preDayNotified=false;x.preHourNotified=false;x.lastNag=0;x.ack=false;
  saveTasks();render();voiceAck();
}
function fmtTime(ts){
  const d=new Date(ts),now=new Date(),loc=t('locale');
  const tm=d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});
  if(d.toDateString()===now.toDateString())return tm;
  return d.toLocaleDateString(loc,{day:'2-digit',month:'2-digit'})+' '+tm;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let curTab='upcoming';
function setTab(tb){curTab=tb;
  document.getElementById('tabUpcoming').classList.toggle('on',tb==='upcoming');
  document.getElementById('tabDone').classList.toggle('on',tb==='done');
  render();}
function renderManageList(){
  const ml=document.getElementById('manageList');if(!ml)return;
  const open=tasks.filter(x=>!x.done).sort((a,b)=>a.when-b.when);
  if(!open.length){ml.innerHTML='<div class="manage-empty">'+t('emptyShort')+'</div>';return;}
  ml.innerHTML=open.map(x=>
    '<div class="manage-item"><div class="manage-info"><div class="manage-title">'+escapeHtml(x.title)+'</div>'
    +'<div class="manage-time">'+fmtTime(x.when)+'</div></div>'
    +'<button class="btn-mini" onclick="openEdit('+x.id+')">'+t('editBtn')+'</button>'
    +'<button class="btn-mini del" onclick="delTask('+x.id+');renderManageList();">'+t('delBtn')+'</button></div>'
  ).join('');
}
function openSettings(){renderManageList();document.getElementById('sheetBackdrop').classList.add('show');}
function closeSettings(){document.getElementById('sheetBackdrop').classList.remove('show');}
function render(){
  const list=document.getElementById('taskList'),now=Date.now();
  const open=tasks.filter(x=>!x.done).sort((a,b)=>a.when-b.when);
  const done=tasks.filter(x=>x.done).sort((a,b)=>b.when-a.when);
  const todayN=open.filter(x=>new Date(x.when).toDateString()===new Date().toDateString()).length;
  document.getElementById('st-today').textContent=todayN;
  document.getElementById('st-pending').textContent=open.length;
  document.getElementById('st-done').textContent=done.length;
  document.getElementById('statPending').classList.toggle('hot',open.some(x=>x.when<now));
  document.getElementById('statPending').classList.toggle('show',open.some(x=>x.when<now));
  if(!tasks.length){list.innerHTML='<div class="empty"><span class="big">'+t('emptyBig')+'</span>'+t('empty')+'</div>';return;}
  let html='';
  const dueNow=tasks.filter(x=>!x.done&&!x.ack&&x.when<=now);
  if(dueNow.length){
    html+='<div class="nag-banner"><div class="nag-title">'+t('nagTitle')+'</div>';
    for(const x of dueNow)
      html+='<div class="nag-item"><span>'+escapeHtml(x.title)+'</span><button class="btn-ack" onclick="ackTask('+x.id+')">'+t('ackBtn')+'</button></div>';
    html+='</div>';
  }
  const groups=curTab==='upcoming'?[[t('secUpcoming'),open]]:[[t('secDone'),done]];
  for(const g of groups){
    if(!g[1].length){html+='<div class="empty"><span class="big">'+t('emptyBig')+'</span>'+t('empty')+'</div>';continue;}
    html+='<div class="section-title">'+g[0]+'</div>';
    for(const x of g[1]){
      try{
      const od=!x.done&&x.when<now;
      html+='<div class="task'+(x.done?' done':'')+(od?' overdue':'')+'">'
        +'<div class="check" onclick="toggleDone('+x.id+')">'+(x.done?'✓':'')+'</div>'
        +'<div class="t-body"><div class="t-title">'+escapeHtml(x.title)
        +(x.repeat==='daily'?'<span class="badge">'+t('bDaily')+'</span>':'')
        +(x.repeat==='weekly'?'<span class="badge">'+t('bWeekly')+'</span>':'')
        +(od?'<span class="badge late">'+t('overdue')+'</span>':'')
        +'</div><div class="t-meta"><span class="t-time">'+fmtTime(x.when)+'</span>'
        +(x.note?' · '+escapeHtml(x.note):'')+'</div></div>'
        +(x.done?'':'<div class="t-btns"><button class="btn-mini ack" onclick="ackTask('+x.id+')">'+t('ackBtn')+'</button><button class="btn-mini tg" onclick="sendToTelegram('+x.id+')" title="'+t('tgSendHint')+'">📤 Telegram</button></div>')
        +'</div>';
      }catch(e){console.warn('task render failed',e);}
    }
  }
  list.innerHTML=html;
}

/* ---- Nhập bằng giọng nói: nghe LIÊN TỤC tới khi bấm ⏹, rồi tách từ khóa ---- */
let recog=null, wantListen=false, finalTxt='', restartTimer=null;
function setMicUI(on){
  const btn=document.getElementById('micBtn');
  btn.classList.toggle('listening',on);
  btn.textContent=on?'\u23F9':'\uD83C\uDFA4'; /* ⏹ khi đang nghe, 🎤 khi nghỉ */
}
function startRecog(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR();
  recog.lang=LANG==='zh'?'zh-CN':LANG==='en'?'en-US':'vi-VN';
  recog.interimResults=true; recog.continuous=true; recog.maxAlternatives=1;
  recog.onresult=function(e){
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const tr=e.results[i][0].transcript;
      if(e.results[i].isFinal) finalTxt+=(finalTxt?' ':'')+tr.trim();
      else interim+=tr;
    }
    document.getElementById('f-title').value=(finalTxt+(interim?' '+interim:'')).trim();
    document.getElementById('micStatus').textContent=t('micListening');
  };
  recog.onerror=function(e){
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){
      wantListen=false; setMicUI(false);
      document.getElementById('micStatus').textContent=t('micNoPerm');
    }
    /* lỗi no-speech/aborted/network -> onend sẽ tự khởi động lại */
  };
  recog.onend=function(){
    if(wantListen){
      /* Tự nghe tiếp, không dừng ngang khi anh ngừng lấy hơi */
      clearTimeout(restartTimer);
      restartTimer=setTimeout(function(){ if(wantListen){ try{startRecog();}catch(e){} } },250);
    }
  };
  recog.start();
}
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert(t('micNoSupport')); return; }
  if(wantListen){ stopMic(); return; }  /* bấm lần 2 = dừng */
  wantListen=true; finalTxt='';
  document.getElementById('f-title').value='';
  try{
    startRecog(); setMicUI(true);
    document.getElementById('micStatus').textContent=t('micListening');
  }catch(e){ wantListen=false; setMicUI(false); }
}
function stopMic(){
  wantListen=false; clearTimeout(restartTimer);
  try{ if(recog)recog.stop(); }catch(e){}
  recog=null; setMicUI(false);
  finalTxt=finalTxt.trim();
  if(finalTxt){ parseVoiceCommand(finalTxt); }  /* điền form, CHỜ anh bấm "Nhắc tôi nhé" */
  else{ document.getElementById('micStatus').textContent=t('micEmpty'); }
}
function toDTLocal(d){
  const pad=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
}
/* Tách từ khóa tiếng Việt: giờ, ngày, lặp lại -> tiêu đề gọn */
function parseViCommand(raw){
  let s=' '+raw.toLowerCase().trim()+' ';
  let repeat='none';
  const date=new Date(); let hasDate=false, hour=null, minute=0;
  s=s.replace(/mỗi ngày|hằng ngày|hàng ngày|moi ngay|hang ngay/g,function(){repeat='daily';return ' ';});
  s=s.replace(/mỗi tuần|hằng tuần|hàng tuần|moi tuan|hang tuan/g,function(){repeat='weekly';return ' ';});
  if(/\bhôm nay\b|\bbữa nay\b|\bnay\b/.test(s)){ hasDate=true; s=s.replace(/hôm nay|bữa nay|\bnay\b/g,' '); }
  else if(/\bngày mai\b/.test(s)){ hasDate=true; date.setDate(date.getDate()+1); s=s.replace(/ngày mai/g,' '); }
  else if(/(^|\s)mai(\s|$)/.test(s)){ hasDate=true; date.setDate(date.getDate()+1); s=s.replace(/(^|\s)mai(\s|$)/g,' '); }
  else if(/\bngày mốt\b|\bmốt\b/.test(s)){ hasDate=true; date.setDate(date.getDate()+2); s=s.replace(/ngày mốt|\bmốt\b/g,' '); }
  else if(/\bngày kia\b/.test(s)){ hasDate=true; date.setDate(date.getDate()+2); s=s.replace(/ngày kia/g,' '); }
  else{
    let nextWeek=/\btuần sau\b/.test(s); s=s.replace(/\btuần sau\b|\btuần này\b/g,' ');
    let m=s.match(/\bthứ\s*([2-7])\b/);
    if(m){ hasDate=true; const tw=(+m[1])-1; let diff=(tw-date.getDay()+7)%7; if(nextWeek)diff+=7; date.setDate(date.getDate()+diff); s=s.replace(/\bthứ\s*[2-7]\b/,' '); }
    else if(/\bchủ nhật\b/.test(s)){ hasDate=true; let diff=(0-date.getDay()+7)%7; date.setDate(date.getDate()+diff); s=s.replace(/\bchủ nhật\b/g,' '); }
    else if((m=s.match(/\bngày\s*(\d{1,2})\b/))){ hasDate=true; let d=+m[1]; const t=new Date(date); t.setDate(d); if(t<date && d<date.getDate()) t.setMonth(t.getMonth()+1); date.setTime(t.getTime()); s=s.replace(/\bngày\s*\d{1,2}\b/,' '); }
  }
  let m=s.match(/(\d{1,2})\s*(?:giờ|h)\s*(?:kém\s*(\d{1,2})|rưỡi)?/);
  if(!m) m=s.match(/(\d{1,2})\s*:\s*(\d{1,2})/);
  if(m){
    hour=+m[1]; minute=0;
    if(/kém/.test(m[0])){ minute=60-(+m[2]); hour-=1; }
    else if(/rưỡi/.test(m[0])){ minute=30; }
    else if(m[2]!==undefined && !/kém|rưỡi/.test(m[0])){ minute=+m[2]; }
    const period=/sáng|trưa|chiều|tối|đêm|khuya/.exec(s);
    if(period){
      const p=period[0];
      if((p==='chiều'||p==='tối'||p==='đêm')&&hour<12) hour+=12;
      if(p==='trưa'&&hour<12) hour=12;
      if(p==='khuya'&&hour>=1&&hour<=5) hour=hour; // giữ nguyên
    }
    s=s.replace(m[0],' ');
    s=s.replace(/\bsáng\b|\btrưa\b|\bchiều\b|\btối\b|\bđêm\b|\bkhuya\b|\bđúng\s*giờ\b|\bđúng\b/g,' ');
  }
  const fillers=['nhắc tôi','nhắc anh','nhắc giúp','nhắc dùm','nhắc giùm','nhắc hộ','giúp tôi','giúp anh','làm ơn','vào lúc','lúc','vào',' là ','nhé','nha',' đi ',' ạ ',' dùm ',' giùm ',' hộ ','cho tôi','cho anh','tôi muốn','mình muốn','hãy','đặt lịch','đặt nhắc','tạo nhắc'];
  fillers.forEach(function(f){ s=s.split(f).join(' '); });
  s=s.replace(/\s+/g,' ').trim();
  let title=s? s.charAt(0).toUpperCase()+s.slice(1) : raw.trim();
  let when=null;
  if(hour!==null){
    date.setHours(hour,minute,0,0);
    if(!hasDate && date<=new Date()) date.setDate(date.getDate()+1);
    when=new Date(date);
  } else if(hasDate){
    date.setHours(8,0,0,0); when=new Date(date);
  }
  return {title:title, when:when, repeat:repeat};
}
function parseEnCommand(raw){
  let s=' '+raw.toLowerCase().trim()+' ';
  let repeat='none'; const date=new Date(); let hasDate=false, hour=null, minute=0;
  if(/\bevery day\b/.test(s)){repeat='daily';s=s.replace(/every day/g,' ');}
  if(/\bevery week\b/.test(s)){repeat='weekly';s=s.replace(/every week/g,' ');}
  if(/\btomorrow\b/.test(s)){hasDate=true;date.setDate(date.getDate()+1);s=s.replace(/tomorrow/g,' ');}
  let m=s.match(/\b(\d{1,2})(?::(\d{1,2}))?\s*(am|pm)\b/)||s.match(/\bat\s+(\d{1,2})(?::(\d{1,2}))?\b/);
  if(m){ hour=+m[1]; minute=m[2]?+m[2]:0;
    if(m[3]==='pm'&&hour<12)hour+=12; if(m[3]==='am'&&hour===12)hour=0;
    s=s.replace(m[0],' '); }
  ['remind me to','remind me','please'].forEach(function(f){s=s.split(f).join(' ');});
  s=s.replace(/\s+/g,' ').trim();
  let title=s? s.charAt(0).toUpperCase()+s.slice(1) : raw.trim();
  let when=null;
  if(hour!==null){ date.setHours(hour,minute,0,0); if(!hasDate&&date<=new Date())date.setDate(date.getDate()+1); when=new Date(date); }
  else if(hasDate){ date.setHours(8,0,0,0); when=new Date(date); }
  return {title:title,when:when,repeat:repeat};
}
function parseVoiceCommand(txt){
  const r = LANG==='en' ? parseEnCommand(txt) : (LANG==='zh' ? {title:txt.trim(),when:null,repeat:'none'} : parseViCommand(txt));
  document.getElementById('f-title').value=r.title;
  document.getElementById('f-repeat').value=r.repeat;
  if(r.when) document.getElementById('f-when').value=toDTLocal(r.when);
  let sum=t('micHeard')+'<b>"'+r.title.replace(/</g,'&lt;')+'"</b>';
  if(r.when) sum+=' · '+fmtTime(r.when.getTime());
  if(r.repeat!=='none') sum+=' · '+(r.repeat==='daily'?t('bDaily'):t('bWeekly'));
  document.getElementById('micStatus').innerHTML=sum;
}

/* ---- Âm báo + giọng Uyển Nhi ---- */
function beep(){
  if(!settings.sound)return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [523,659,784].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);o.frequency.value=f;o.type='sine';
      const tm=ctx.currentTime+i*0.22;
      g.gain.setValueAtTime(0.001,tm);g.gain.exponentialRampToValueAtTime(0.5,tm+0.03);
      g.gain.exponentialRampToValueAtTime(0.001,tm+0.2);
      o.start(tm);o.stop(tm+0.22);
    });
  }catch(e){}
}
/* Giọng Uyển Nhi thật (file thu sẵn) — KHÔNG dùng giọng máy */
let voiceGen=0;
function playAudio(src){return new Promise(res=>{try{const a=new Audio(src);a.volume=1;a.onended=res;a.onerror=res;const pr=a.play();if(pr&&pr.catch)pr.catch(res);}catch(e){res();}});}
function speakSeq(items){
  if(!settings.voice)return;
  const g=++voiceGen;
  (async()=>{for(const it of items){if(g!==voiceGen)return;await playAudio(it);}})();
}
function voiceAdd(){speakSeq(['audio/added.mp3']);}
function voiceAck(){speakSeq(['audio/acked.mp3']);}
function voiceTest(){speakSeq(['audio/test-ok.mp3']);}
function withMemo(memo,intro,outro){
  const seq=[intro]; if(memo)seq.push(memo); if(outro)seq.push(outro); return seq;
}
function voiceNag(memo){speakSeq(withMemo(memo,'audio/nag-intro.mp3','audio/nag-outro.mp3'));}
function voicePreDay(memo){speakSeq(withMemo(memo,'audio/preday-intro.mp3',null));}
function voicePreHour(memo){speakSeq(withMemo(memo,'audio/prehour-intro.mp3',null));}
function testNotify(){
  beep();voiceTest();
  if('Notification' in window&&Notification.permission==='granted')
    new Notification(t('nTestT'),{body:t('nTestB'),icon:'avatar.png'});
  else askPermission();
}
/* ---- Thu tên sự kiện bằng giọng anh, phát kèm khi Uyển Nhi nhắc ---- */
let memoRecorder=null, memoChunks=[], memoStream=null, pendingMemo=null, memoTimer=null;
function memoUI(){
  const rec=memoRecorder&&memoRecorder.state==='recording';
  document.getElementById('memoBtn').classList.toggle('rec',!!rec);
  document.getElementById('memoBtnT').textContent=rec?t('memoRec'):t('memoBtn');
  document.getElementById('memoPlay').style.display=pendingMemo?'':'none';
  document.getElementById('memoDel').style.display=pendingMemo?'':'none';
  if(!pendingMemo&&!rec)document.getElementById('memoStatus').textContent='';
}
async function toggleMemoRec(){
  if(memoRecorder&&memoRecorder.state==='recording'){stopMemoRec();return;}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert(t('memoNoMic'));return;}
  try{ memoStream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ alert(t('memoNoMic')); return; }
  memoChunks=[];
  try{ memoRecorder=new MediaRecorder(memoStream); }
  catch(e){ alert(t('memoNoMic')); return; }
  memoRecorder.ondataavailable=function(e){ if(e.data&&e.data.size)memoChunks.push(e.data); };
  memoRecorder.onstop=function(){
    const blob=new Blob(memoChunks,{type:memoRecorder.mimeType||'audio/webm'});
    const rd=new FileReader();
    rd.onload=function(){ pendingMemo=rd.result; memoUI();
      document.getElementById('memoStatus').textContent=t('memoDone'); };
    rd.readAsDataURL(blob);
    if(memoStream)memoStream.getTracks().forEach(function(tr){tr.stop();});
    memoStream=null;
  };
  memoRecorder.start(); memoUI();
  clearTimeout(memoTimer);
  memoTimer=setTimeout(function(){ if(memoRecorder&&memoRecorder.state==='recording')stopMemoRec(); },8000);
}
function stopMemoRec(){
  clearTimeout(memoTimer);
  try{ if(memoRecorder&&memoRecorder.state!=='inactive')memoRecorder.stop(); }catch(e){}
}
function playMemoPreview(){ if(pendingMemo)playAudio(pendingMemo); }
/* Gửi lịch sang Telegram: mở deep link, bot tự tạo lịch để nhắc nền */
function sendToTelegram(id){
  const x=tasks.find(a=>a.id===id); if(!x)return;
  const rep=x.repeat==='daily'?'d':x.repeat==='weekly'?'w':'n';
  let title=x.title;
  let raw=x.when+'|'+rep+'|'+title;
  let b64=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  let payload='add_'+b64;
  while(payload.length>60&&title.length>4){
    title=title.slice(0,-2);
    raw=x.when+'|'+rep+'|'+title;
    b64=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    payload='add_'+b64;
  }
  if(payload.length>60){ alert(t('tgTooLong')); return; }
  window.open('https://t.me/UyenNhiTroLy_bot?start='+payload,'_blank');
}
function clearMemo(){ pendingMemo=null; memoUI(); }

/* Nút cài app ra màn hình chính (PWA) */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBtn').style.display='';
});
async function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt=null;
    document.getElementById('installBtn').style.display='none'; }
  else{ alert(t('phoneGuide')); }
}
window.addEventListener('appinstalled',function(){
  document.getElementById('installBtn').style.display='none'; deferredPrompt=null;
});

/* Mở khóa âm thanh ngay lần chạm đầu tiên (trình duyệt chặn tiếng nếu chưa tương tác) */
let audioUnlocked=false;
function unlockAudio(){
  if(audioUnlocked)return; audioUnlocked=true;
  try{
    const a=new Audio('audio/test-ok.mp3'); a.volume=0; a.play().then(()=>{a.pause();}).catch(()=>{});
  }catch(e){}
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
  }catch(e){}
}
['pointerdown','touchstart','keydown'].forEach(function(ev){
  document.addEventListener(ev,unlockAudio,{once:true,passive:true});
});
/* Giữ màn hình sáng khi trang đang mở (điện thoại) để lịch nhắc đúng giờ */
let wakeLock=null;
async function keepAwake(){
  try{
    if('wakeLock' in navigator&&document.visibilityState==='visible'){
      wakeLock=await navigator.wakeLock.request('screen');
    }
  }catch(e){}
}
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible'){ keepAwake(); checkReminders(); }
});
keepAwake();

/* ---- Vòng nhắc: tối hôm trước 20:00 → 30 phút trước → dồn dập đến khi "Đã nhớ" ---- */
function notify(title,body,tag){
  beep();
  if('Notification' in window&&Notification.permission==='granted')
    new Notification(title,{body:body,icon:'avatar.png',tag:tag||('n'+Date.now())});
}
setInterval(checkReminders,20000);
function checkReminders(){
  const now=Date.now();let changed=false;
  for(const x of tasks){
    if(x.done||x.ack)continue;
    const eve=new Date(x.when);eve.setDate(eve.getDate()-1);eve.setHours(20,0,0,0);
    if(!x.preDayNotified&&now>=eve.getTime()&&now<x.when-3600000){
      x.preDayNotified=true;changed=true;
      notify(t('nPreDayT'),x.title+' · '+fmtTime(x.when)+(x.note?'\n'+x.note:''),'preday-'+x.id);
      voicePreDay(x.memo||null);
    }
    if(!x.preHourNotified&&now>=x.when-1800000&&now<x.when){
      x.preHourNotified=true;changed=true;
      notify(t('nPreHourT'),t('nPreHourB')+x.title,'prehour-'+x.id);
      voicePreHour(x.memo||null);
    }
    if(now>=x.when-300000&&now-(x.lastNag||0)>=60000){
      x.lastNag=now;changed=true;
      beep();voiceNag(x.memo||null);
      if('Notification' in window&&Notification.permission==='granted')
        new Notification(t('nNagT'),{body:x.title+(x.note?'\n'+x.note:''),icon:'avatar.png',tag:'nag-'+x.id,requireInteraction:true});
    }
  }
  if(changed)saveTasks();
  render();
}
/* ---- init ---- */
(function(){
  document.getElementById('set-voice').checked=settings.voice;
  document.getElementById('set-sound').checked=settings.sound;
  document.getElementById('set-voice').onchange=e=>{settings.voice=e.target.checked;saveSettings();};
  document.getElementById('set-sound').onchange=e=>{settings.sound=e.target.checked;saveSettings();};
  if('Notification' in window&&Notification.permission==='default')
    document.getElementById('permBanner').classList.add('show');
  applyLang(); checkReminders();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
